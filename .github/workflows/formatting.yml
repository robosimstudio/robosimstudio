name: formatting

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: formatting-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Ruff check
        run: uvx ruff@0.16.1 check . --output-format github
      - name: Ruff format
        run: uvx ruff@0.16.1 format . --check
