name: publish

# Builds the wheel and sdist and keeps them as a workflow artifact when a GitHub
# release is created. Nothing is uploaded to PyPI: pyroki is a git direct
# reference (see pyproject.toml), which PyPI refuses in a wheel's metadata. Until
# pyroki is on an index, install from git:
#   pip install "robosimstudio @ git+https://github.com/robosimstudio/robosimstudio"
# A workflow artifact rather than a release asset, so the job needs no write
# token.

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Fast tier must pass
        run: uv run --extra dev python scripts/testrun.py --tier fast
      - name: Build
        run: uv build
      - name: Verify wheel contents
        # Robot assets and the cloth, soft and rope kinds sit outside the usual
        # Python-file packaging path; a wheel without them imports and then
        # cannot build a scene.
        run: |
          python3 - <<'PY'
          import glob
          import zipfile

          (wheel,) = glob.glob("dist/*.whl")
          names = set(zipfile.ZipFile(wheel).namelist())
          needed = [
              "robosimstudio/assets/embodiments/panda/panda_standalone.xml",
              "robosimstudio/_domain_packs/cloth.py",
              "robosimstudio/_domain_packs/soft.py",
              "robosimstudio/_domain_packs/rod/__init__.py",
          ]
          missing = [path for path in needed if path not in names]
          assert not missing, f"Missing from {wheel}: {missing}"
          print(f"{wheel} OK: {len(names)} files")
          PY
      - name: Keep the built distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
